<body class="bg-[#f8f5ef] text-[#1f2a3d]">

    <script>
            function initTailwind() {
                // Tailwind уже подключён
            }
            
            function initForm() {
                const form = document.getElementById('rsvp-form');
                const success = document.getElementById('success');

                form.addEventListener('submit', async function(e) {
                    e.preventDefault();

                    const btn = form.querySelector('button');
                    const originalText = btn.innerHTML;

                    btn.disabled = true;
                    btn.innerHTML = 'Отправляем...';

                    const name = document.getElementById('name').value.trim();
                    const phone = document.getElementById('phone').value.trim();

                    const googleFormUrl = 'https://docs.google.com/forms/d/e/1FAIpQLScMwrZk-UYd_7H8256OM6JXs7qo75_A_pW1k5Gk1p6odZ-1rA/viewform?usp=dialog';

                    const formData = new FormData();

                    formData.append('entry.1522371729', name);
                    formData.append('entry.668100698', phone);

                    try {
                        await fetch(googleFormUrl, {
                            method: 'POST',
                            mode: 'no-cors',
                            body: formData
                        });

                        form.style.display = 'none';
                        success.classList.remove('hidden');
                        createConfetti();

                    } catch (error) {
                        btn.disabled = false;
                        btn.innerHTML = originalText;
                        alert('Не получилось отправить форму. Попробуйте ещё раз.');
                    }
                });
            }
        function createConfetti() {
            const colors = ['#5b7a9e', '#d9c9b8', '#f5f0e6'];
            for (let i = 0; i < 40; i++) {
                setTimeout(() => {
                    const particle = document.createElement('div');
                    particle.style.cssText = `
                        position: fixed;
                        left: ${Math.random() * 100}vw;
                        top: -20px;
                        width: 8px;
                        height: 8px;
                        background: ${colors[Math.floor(Math.random()*colors.length)]};
                        border-radius: 50%;
                        pointer-events: none;
                        z-index: 9999;
                        opacity: ${Math.random() * 0.7 + 0.3};
                    `;
                    document.body.appendChild(particle);
                    
                    particle.animate([
                        { transform: 'translateY(0) rotate(0deg)' },
                        { transform: `translateY(${window.innerHeight + 120}px) rotate(${Math.random()*720 - 360}deg)` }
                    ], {
                        duration: Math.random() * 2600 + 2200,
                        easing: 'cubic-bezier(0.25, 0.1, 0.25, 1)'
                    }).onfinish = () => particle.remove();
                }, i * 2);
            }
        }
        
        function init() {
            initTailwind();
            initForm();
        }
        
        window.onload = init;
    </script>
    <script>
        // Параллакс только для героя (на локации оставляем обычный fixed внутри секции)
        function initParallax() {
            const heroBg = document.querySelector('.hero-bg');

            let ticking = false;

            function updatePosition() {
                const scrollY = window.scrollY;
                const speed = 0.7;

                if (heroBg) {
                    heroBg.style.transform = `translateY(${scrollY * speed}px)`;
                }
                ticking = false;
            }

            window.addEventListener('scroll', () => {
                if (!ticking) {
                    requestAnimationFrame(updatePosition);
                    ticking = true;
                }
            });
        }

        window.addEventListener('load', initParallax);
    
    </script>
